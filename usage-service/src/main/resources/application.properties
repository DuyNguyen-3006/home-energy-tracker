spring.application.name=usage-service
server.port=8083
springdoc.swagger-ui.path=/swagger

# Actuator & Prometheus (scraped by Prometheus in docker-compose)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}

#Kafka - consumer
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9094}
spring.kafka.consumer.group-id=usage-service
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.type.mapping=energyUsageEvent:com.andrew.kafka.event.EnergyUsageEvent

#Kafka - producer
spring.kafka.template.default-topic=energy-alerts
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer


#Influx DB Configuration
# Luu y: 8072 la cong map ra host. Trong mang Docker, InfluxDB lang nghe 8086.
influx.url=${INFLUX_URL:http://localhost:8072}
influx.token=${INFLUX_TOKEN:my-token}
influx.org=${INFLUX_ORG:andrew}
influx.bucket=${INFLUX_BUCKET:usage-bucket}


device.service.url=${DEVICE_SERVICE_URL:http://localhost:8081}/api/v1/device
user.service.url=${USER_SERVICE_URL:http://localhost:8080}/api/v1/user
