spring.application.name=insight-service
server.port=8085
springdoc.swagger-ui.path=/swagger

# Actuator & Prometheus (scraped by Prometheus in docker-compose)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}

usage.service.url=${USAGE_SERVICE_URL:http://localhost:8083}/api/v1/usage

spring.ai.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:deepseek-coder:latest}
spring.ai.ollama.init.pull-model-strategy=never
