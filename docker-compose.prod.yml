# File DUY NHAT chay tren EC2. Khac ban local o 3 diem:
#   1. KHONG co container mysql  -> dung Amazon RDS
#   2. Image KEO TU ECR          -> khong build tren server
#   3. Chi api-gateway mo ra Internet; cac service khac bind 127.0.0.1
#      (chi vao duoc qua SSH tunnel, du Security Group co mo cong cung khong toi duoc)
#
# Chay:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Muon bat them Prometheus + Grafana + Kafka-UI (ton them ~1GB RAM):
#   docker compose -f docker-compose.prod.yml --profile observability up -d
#
# Bien moi truong doc tu file .env cung thu muc (xem .env.example).

services:

  # ---------------- Ha tang ----------------

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: 'Zr2KCHooTb2qId75ClyYOw'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 40s
    mem_limit: 1g
    restart: unless-stopped

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    ports:
      - "127.0.0.1:8072:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: andrew
      DOCKER_INFLUXDB_INIT_BUCKET: usage-bucket
      DOCKER_INFLUXDB_INIT_RETENTION: 1w
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
    volumes:
      - influx-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 512m
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "127.0.0.1:8025:8025"
    mem_limit: 128m
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      # Keycloak 24 dung bien KC_* . Bo DB_VENDOR/DB_ADDR kieu cu (bi bo qua).
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://${DB_HOST}:3306/keycloak
      KC_DB_USERNAME: ${DB_USERNAME}
      KC_DB_PASSWORD: ${DB_PASSWORD}
      KC_HOSTNAME_STRICT: "false"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "127.0.0.1:8091:8080"
    volumes:
      - ./docker/keycloak/realms/:/opt/keycloak/data/import/
    mem_limit: 768m
    restart: unless-stopped

  # ---------------- Ung dung (image tu ECR) ----------------

  user-service:
    image: ${ECR_REGISTRY}/het/user-service:${IMAGE_TAG}
    container_name: user-service
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DB_URL: jdbc:mysql://${DB_HOST}:3306/home_energy_tracker
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    mem_limit: 512m
    restart: unless-stopped

  device-service:
    image: ${ECR_REGISTRY}/het/device-service:${IMAGE_TAG}
    container_name: device-service
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      DB_URL: jdbc:mysql://${DB_HOST}:3306/home_energy_tracker
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - user-service
    mem_limit: 512m
    restart: unless-stopped

  ingestion-service:
    image: ${ECR_REGISTRY}/het/ingestion-service:${IMAGE_TAG}
    container_name: ingestion-service
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      KAFKA_BROKERS: kafka:9092
      # TAT simulator tren AWS. Bat len la EC2 chet.
      SIMULATION_REQUESTS: "0"
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

  usage-service:
    image: ${ECR_REGISTRY}/het/usage-service:${IMAGE_TAG}
    container_name: usage-service
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      KAFKA_BROKERS: kafka:9092
      INFLUX_URL: http://influxdb:8086
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: andrew
      INFLUX_BUCKET: usage-bucket
      DEVICE_SERVICE_URL: http://device-service:8081
      USER_SERVICE_URL: http://user-service:8080
    depends_on:
      kafka:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

  alert-service:
    image: ${ECR_REGISTRY}/het/alert-service:${IMAGE_TAG}
    container_name: alert-service
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      DB_URL: jdbc:mysql://${DB_HOST}:3306/home_energy_tracker
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KAFKA_BROKERS: kafka:9092
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

  insight-service:
    image: ${ECR_REGISTRY}/het/insight-service:${IMAGE_TAG}
    container_name: insight-service
    profiles: ["ai"]
    ports:
      - "127.0.0.1:8085:8085"
    environment:
      USAGE_SERVICE_URL: http://usage-service:8083
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
    depends_on:
      - usage-service
    mem_limit: 512m
    restart: unless-stopped

  api-gateway:
    image: ${ECR_REGISTRY}/het/api-gateway:${IMAGE_TAG}
    container_name: api-gateway
    # DUY NHAT service nay mo ra Internet.
    ports:
      - "9000:9000"
    environment:
      USER_SERVICE_URL: http://user-service:8080
      DEVICE_SERVICE_URL: http://device-service:8081
      INGESTION_SERVICE_URL: http://ingestion-service:8082
      INSIGHT_SERVICE_URL: http://insight-service:8085
      KEYCLOAK_URL: http://keycloak:8080
    depends_on:
      - user-service
      - device-service
      - ingestion-service
    mem_limit: 512m
    restart: unless-stopped

  # ---------------- Quan sat (tuy chon) ----------------
  # Chi chay khi them: --profile observability

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: prometheus
    profiles: ["observability"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.docker.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=5d
    mem_limit: 384m
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    mem_limit: 256m
    restart: unless-stopped

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    profiles: ["observability"]
    ports:
      - "127.0.0.1:8070:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: aws
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: 'true'
    depends_on:
      - kafka
    mem_limit: 384m
    restart: unless-stopped

volumes:
  kafka-data:
  influx-data:
  grafana-data:
