spring.application.name=user-service
server.port = 8080

# Actuator & Prometheus (scraped by Prometheus in docker-compose)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}

springdoc.swagger-ui.path=/swagger

# MySQL Database Configuration
# Gia tri sau dau ":" la mac dinh khi chay local ngoai Docker.
# Docker / AWS ghi de bang bien moi truong.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/home_energy_tracker}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
