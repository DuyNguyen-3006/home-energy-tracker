spring.application.name=ingestion-service
server.port=8082
springdoc.swagger-ui.path=/swagger

# Actuator & Prometheus (scraped by Prometheus in docker-compose)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.metrics.tags.application=${spring.application.name}

#Kafka
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9094}
spring.kafka.template.default-topic=energy-usage
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

#continuous ingestion
# Dat SIMULATION_REQUESTS=0 de tat simulator.
# BAT BUOC tat tren AWS: 1000 request/5s se lam nghen EC2.
simulation.endpoint=${SIMULATION_ENDPOINT:http://localhost:8082/api/v1/ingestion}
simulation.interval-ms=${SIMULATION_INTERVAL_MS:5000}
simulation.requests-per-interval=${SIMULATION_REQUESTS:1000}
simulation.parallel-threads=${SIMULATION_THREADS:10}
